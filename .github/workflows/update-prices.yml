name: update-prices

# Weekly: regenerate the LiteLLM part of the bundled price table (FR-4, D4) at LiteLLM's latest
# commit, and open a PR when a rate changed. A human reviews every price change before it ships.
# Uses the built-in GITHUB_TOKEN only. The repo must allow GitHub Actions to create pull requests
# (Settings → Actions → General). PRs opened with GITHUB_TOKEN don't trigger other workflows, so
# this job runs the checks itself before pushing; re-run ci from the PR page if you want it there.
on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: chore/update-prices
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Pin LiteLLM's latest commit
        run: |
          sha=$(gh api repos/BerriAI/litellm/commits/main --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected commit id"; exit 1; }
          echo "LITELLM_SHA=$sha" >> "$GITHUB_ENV"
      - name: Regenerate prices.toml
        run: uv run scripts/update_prices.py --revision "$LITELLM_SHA" --summary "$RUNNER_TEMP/summary.md"
      - name: Anything changed?
        id: diff
        run: |
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- src/openvigie/prices.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checks
        if: steps.diff.outputs.changed == 'true'
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest
      - name: Open or update the PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "chore(pricing): update bundled prices from LiteLLM ${LITELLM_SHA:0:12} (FR-4)" \
            -- src/openvigie/prices.toml
          git push --force origin "$BRANCH"
          {
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Generated by \`scripts/update_prices.py\` from"
            echo "[LiteLLM \`${LITELLM_SHA:0:12}\`](https://github.com/BerriAI/litellm/blob/$LITELLM_SHA/model_prices_and_context_window.json)."
            echo "Check changed rates against the providers' pricing pages before merging."
          } > "$RUNNER_TEMP/body.md"
          if [ "$(wc -c < "$RUNNER_TEMP/body.md")" -gt 60000 ]; then # GitHub caps PR bodies at 64K
            head -c 60000 "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/short.md"
            printf '\n\n… truncated: the full summary is on the workflow run.\n' >> "$RUNNER_TEMP/short.md"
            mv "$RUNNER_TEMP/short.md" "$RUNNER_TEMP/body.md"
          fi
          title="chore(pricing): update bundled prices from LiteLLM (FR-4)"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
