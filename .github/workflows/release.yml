name: release

# Tag vX.Y.Z → build → install-test on every target platform → publish to PyPI (after a
# maintainer approves the `pypi` environment). Manual runs publish to TestPyPI instead. PRs
# that touch packaging run the build and smoke jobs only.
# Publishing uses PyPI Trusted Publishing (OIDC): no token is stored in this repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/check_release.py
      - pyproject.toml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Tag matches pyproject.toml and CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_release.py version "${GITHUB_REF_NAME#v}"
      - run: uv build
      - name: Wheel has its assets and nothing else
        run: python scripts/check_release.py wheel dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    # `pipx install openvigie` must work on the Pi (linux arm64), Apple Silicon and x86_64.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install pipx
      - run: python -m pipx install dist/*.whl
      - name: openvigie --version && openvigie scan --json
        run: |
          bin="$(python -m pipx environment --value PIPX_BIN_DIR)"
          "$bin/openvigie" --version
          "$bin/openvigie" scan --json

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: smoke
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
