name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Target platforms first: Pi (linux arm64) and Apple Silicon. x86_64 matches cloud dev VMs.
        os: [ubuntu-24.04-arm, macos-14, ubuntu-24.04]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov=openvigie --cov-report=term-missing

  perf:
    # Footprint budget (NFR): peak RSS < 100 MB after backfilling ~90 MB of agent logs.
    # Runs on ARM, the closest hosted runner to a Raspberry Pi.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run scripts/bench_collector.py generate "$RUNNER_TEMP/bench" --sessions 100 --lines 1000
      - run: uv run scripts/bench_collector.py run "$RUNNER_TEMP/bench" --max-rss-mb 100
      - run: rm -rf "$RUNNER_TEMP/bench/state"
      - run: uv run scripts/bench_collector.py run "$RUNNER_TEMP/bench" --max-rss-mb 100 --traces
