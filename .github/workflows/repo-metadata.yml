name: repo-metadata

# Labels and milestones as code: edit .github/repo-metadata.json, merge, and this applies it.
on:
  push:
    branches: [main]
    paths:
      - .github/repo-metadata.json
      - .github/scripts/sync-repo-metadata.js
      - .github/workflows/repo-metadata.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: repo-metadata
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sync = require('./.github/scripts/sync-repo-metadata.js');
            await sync({ github, context, core });
