name: openshell-release

# openvigie supports the latest stable OpenShell only (maintainer decision 2026-10-14). This opens
# one issue when a newer stable release appears, so the bump is deliberate.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: openshell-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_openshell.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
