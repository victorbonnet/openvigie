name: openshell-fixtures

# Records real OpenShell outputs for openvigie's fixture tests (decision D13): installs the
# supported OpenShell release, creates a throwaway sandbox and prints what openvigie parses.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/openshell-fixtures.yml
      - scripts/record_openshell.sh
      - scripts/check_starter_policies.sh
      - scripts/check_policy_apply.py
      - src/openvigie/openshell/apply.py
      - src/openvigie/openshell/policy.py
      - src/openvigie/openshell/starter.*
      - tests/openshell/starter/**

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-24.04-arm # closest hosted runner to a Raspberry Pi
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Supported version
        run: |
          version=$(sed -n 's/^MIN_SUPPORTED = "\(.*\)"$/\1/p' src/openvigie/openshell/versions.py)
          echo "OPENSHELL_VERSION=v$version" >> "$GITHUB_ENV"
      - name: Let the runner user run a systemd user manager (the gateway is a user service)
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          docker version --format '{{.Server.Version}}'
      - name: Install OpenShell (installer from the release tag, packages checksum-verified)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/NVIDIA/OpenShell/${OPENSHELL_VERSION}/install.sh" -o install.sh
          sh install.sh
      - name: OpenShell accepts the starter policies (FR-11)
        run: scripts/check_starter_policies.sh
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: openvigie applies network rules and reverts refused ones (FR-12)
        run: uv run scripts/check_policy_apply.py
      - name: Record (stops the gateway at the end)
        if: always()
        run: scripts/record_openshell.sh
      - name: Gateway logs on failure
        if: failure()
        run: journalctl --user -u openshell-gateway --no-pager -n 200 || true
