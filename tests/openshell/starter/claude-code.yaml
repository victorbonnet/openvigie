# Starter OpenShell policy for Claude Code (claude-code),
# generated by openvigie from what it observed. Review it before use:
#   openshell sandbox create --policy starter.yaml -- <agent command>
# NOTE: MCP server github: add the hosts it calls itself, if any.
# NOTE: MCP server db: add the hosts it calls itself, if any.
version: 1
filesystem_policy:
  include_workdir: true  # the project, read-write
  read_only:
    - "/usr"
    - "/lib"
    - "/etc"
    - "/proc"
    - "/dev/urandom"
    - "/var/log"
  read_write:
    - "/tmp"
    - "/dev/null"
  # the agent may also write ~/shared on the host: mount it and add it
landlock:
  compatibility: "best_effort"
network_policies:
  # the Claude API: every model call
  model_api_1:
    endpoints:
      - host: "api.anthropic.com"
        port: 443
    binaries:
      - path: "/usr/local/bin/claude"
      - path: "/usr/bin/node"
      - path: "/usr/local/bin/node"
  # MCP server github is downloaded by npx at start
  mcp_github_packages:
    endpoints:
      - host: "registry.npmjs.org"
        port: 443
    binaries:
      - path: "/usr/bin/node"
      - path: "/usr/local/bin/node"
      - path: "/usr/bin/npx"
      - path: "/usr/local/bin/npx"
  # MCP server db is downloaded by uvx at start
  mcp_db_packages:
    endpoints:
      - host: "pypi.org"
        port: 443
      - host: "files.pythonhosted.org"
        port: 443
    binaries:
      - path: "/usr/local/bin/uv"
      - path: "/usr/bin/uv"
      - path: "/usr/local/bin/uvx"
  # MCP server docs (remote)
  mcp_docs:
    endpoints:
      - host: "mcp.example.com"
        port: 443
    binaries:
      - path: "/usr/local/bin/claude"
      - path: "/usr/bin/node"
      - path: "/usr/local/bin/node"
