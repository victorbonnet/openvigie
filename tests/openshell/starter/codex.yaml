# Starter OpenShell policy for Codex (codex),
# generated by openvigie from what it observed. Review it before use:
#   openshell sandbox create --policy starter.yaml -- <agent command>
# NOTE: MCP server docs: add the hosts it calls itself, if any.
version: 1
filesystem_policy:
  include_workdir: true  # the project, read-write
  read_only:
    - "/usr"
    - "/lib"
    - "/etc"
    - "/proc"
    - "/dev/urandom"
    - "/var/log"
  read_write:
    - "/tmp"
    - "/dev/null"
landlock:
  compatibility: "best_effort"
network_policies:
  # the OpenAI API: model calls with an API key
  model_api_1:
    endpoints:
      - host: "api.openai.com"
        port: 443
    binaries:
      - path: "/usr/local/bin/codex"
      - path: "/usr/bin/codex"
  # model calls when signed in with a ChatGPT plan
  model_api_2:
    endpoints:
      - host: "chatgpt.com"
        port: 443
    binaries:
      - path: "/usr/local/bin/codex"
      - path: "/usr/bin/codex"
  # refreshing a ChatGPT sign-in
  model_api_3:
    endpoints:
      - host: "auth.openai.com"
        port: 443
    binaries:
      - path: "/usr/local/bin/codex"
      - path: "/usr/bin/codex"
  # MCP server docs is downloaded by npx at start
  mcp_docs_packages:
    endpoints:
      - host: "registry.npmjs.org"
        port: 443
    binaries:
      - path: "/usr/bin/node"
      - path: "/usr/local/bin/node"
      - path: "/usr/bin/npx"
      - path: "/usr/local/bin/npx"
