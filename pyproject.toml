[project]
name = "openvigie"
version = "0.0.1"
description = "Control tower for AI agents on your own machines: discover, monitor, sandbox."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Victor Bonnet" }]
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "psutil>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
openvigie = "openvigie.cli:main"

[project.entry-points."openvigie.adapters"]
claude-code = "openvigie.adapters.claude_code:ClaudeCodeAdapter"
codex = "openvigie.adapters.codex:CodexAdapter"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-psutil>=7.2.2.20260906",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openvigie"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RUF",
    "S",   # bandit: security-first project
    "PTH", # pathlib over os.path
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
python_version = "3.12"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["e2e: end-to-end tests that start a real hub on loopback"]
