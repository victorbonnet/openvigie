# codex-auto-review stays unpriced on purpose. It is a hidden routing alias in the Codex model
# catalog (no model, no provider), not a public API model: OpenAI publishes no rate for it, the
# backend may route it to different models over time, and auto-review is reported as no longer
# drawing plan usage. Any rate here would be a guess, and unknown must not read as zero.
