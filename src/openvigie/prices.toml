# Bundled price table (USD per million tokens). Override any entry, or add models, in
# <config dir>/prices.toml using the same format; overrides win per provider + model id.
#
# cached_input_included: true when the provider counts cached tokens inside input_tokens
# (OpenAI), false when cache reads/writes are reported separately (Anthropic).
# Models missing from the table are "unpriced": their cost shows as unknown, never $0.

[providers.anthropic]
cached_input_included = false
source = "https://platform.claude.com/docs/en/about-claude/pricing"

[providers.openai]
cached_input_included = true
source = "https://openai.com/api/pricing/"

# --- Anthropic: verified 2026-10-14 against Anthropic's published model table.
# Cache writes are 1.25x input (5-minute TTL) and 2x input (1-hour TTL).

[[models]]
provider = "anthropic"
id = "claude-fable-5-1"
input = 10.0
output = 50.0
cache_read = 0.25
cache_write_5m = 12.5
cache_write_1h = 20.0
as_of = "2026-10-14"

