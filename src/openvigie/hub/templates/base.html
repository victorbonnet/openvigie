<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false}'>
  <title>{{ title }} · openvigie</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">openvigie</a>
    <nav>
      {% block nav %}
      <a href="/">Agents</a>
      <a href="/usage">Usage</a>
      <a href="/hosts">Hosts{% set alerts = adapter_alerts(request) %}{% if alerts %} <span class="badge degraded" title="adapters needing attention">{{ alerts }}</span>{% endif %}</a>
      {% endblock %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>openvigie {{ version }} · read-only</footer>
</body>
</html>
